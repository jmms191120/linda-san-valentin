<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linda 💙 Nuestra Ola Infinita</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    background: radial-gradient(circle at bottom, #00172D 0%, #000814 70%);
    color:white;
    text-align:center;
}

/* ESTRELLAS */
.stars{
    position:absolute;
    width:100%;
    height:100%;
    background:url("https://www.transparenttextures.com/patterns/stardust.png");
    animation:moveStars 80s linear infinite;
    z-index:0;
}

@keyframes moveStars{
    from{background-position:0 0;}
    to{background-position:2000px 2000px;}
}

/* CONTENIDO */
.container{
    position:relative;
    z-index:3;
    margin-top:60px;
    padding:20px;
    animation:fadeIn 2s ease-in;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    font-family:'Playfair Display', serif;
    font-size:48px;
    background: linear-gradient(90deg,#ff2e63,#ff8fab,#ff2e63);
    background-size:200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
}

@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

p{
    font-size:20px;
    max-width:650px;
    margin:auto;
    line-height:1.8;
}

/* COUNTDOWN */
.countdown{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
}

.time-box{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding:12px 18px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(255,46,99,0.4);
}

.time-box span{
    display:block;
    font-size:24px;
    font-weight:600;
    color:#ff8fab;
}

.time-box small{
    font-size:11px;
}

/* BOTONES */
.buttons{
    margin-top:40px;
    position:relative;
    height:180px;
}

button{
    padding:14px 35px;
    font-size:17px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    position:absolute;
    transition:0.3s;
    font-weight:600;
}

#yes{
    background:#ff2e63;
    color:white;
    left:30%;
    box-shadow:0 0 25px #ff2e63;
}

#no{
    background:white;
    color:#00172D;
    left:55%;
}

button:hover{
    transform:scale(1.1);
}

/* OLA INTERACTIVA */
.wave-container{
    position:absolute;
    bottom:0;
    width:100%;
    height:300px;
    overflow:hidden;
    z-index:1;
}

.wave{
    position:absolute;
    width:200%;
    height:100%;
    background:linear-gradient(to top,#003566,#0077b6,#00b4d8);
    border-radius:45%;
    animation:waveMove 8s linear infinite;
    transition:transform 0.3s ease;
}

@keyframes waveMove{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
}

/* CORAZONES */
.heart{
    position:absolute;
    color:#ff4d6d;
    animation:float 6s linear infinite;
    font-size:20px;
}

@keyframes float{
    0%{transform:translateY(0); opacity:1;}
    100%{transform:translateY(-600px); opacity:0;}
}

.final{
    margin-top:150px;
    animation:fadeIn 2s ease-in;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
    <h1>🌊 Linda 💙</h1>

    <p>
        Desde que llegaste, mi vida se mueve como el mar…  
        intensa, hermosa y llena de magia 🌅  
        Este 14 de febrero quiero que surfeemos nuestra propia historia.
    </p>

    <div class="countdown">
        <div class="time-box"><span id="days">00</span><small>Días</small></div>
        <div class="time-box"><span id="hours">00</span><small>Horas</small></div>
        <div class="time-box"><span id="minutes">00</span><small>Min</small></div>
        <div class="time-box"><span id="seconds">00</span><small>Seg</small></div>
    </div>

    <div class="buttons">
        <button id="yes" onclick="accept()">Sí acepto 🌊💙</button>
        <button id="no">No acepto 🙈</button>
    </div>
</div>

<div class="wave-container">
    <div class="wave" id="wave"></div>
</div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_5e4bfe63b3.mp3?filename=romantic-love-ambient-124003.mp3" type="audio/mp3">
</audio>

<script>
const noBtn = document.getElementById("no");
const music = document.getElementById("music");
const wave = document.getElementById("wave");

document.body.addEventListener("click", () => {
    music.play().catch(()=>{});
});
