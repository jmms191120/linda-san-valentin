<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linda 💙 Nuestra Ola Infinita</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    background: radial-gradient(circle at bottom, #00172D 0%, #000814 70%);
    color:white;
    text-align:center;
}

/* ESTRELLAS */
.stars{
    position:absolute;
    width:100%;
    height:100%;
    background:url("https://www.transparenttextures.com/patterns/stardust.png");
    animation:moveStars 80s linear infinite;
    z-index:0;
}

@keyframes moveStars{
    from{background-position:0 0;}
    to{background-position:2000px 2000px;}
}

/* CONTENIDO */
.container{
    position:relative;
    z-index:2;
    margin-top:80px;
    padding:20px;
    animation:fadeIn 2s ease-in;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    font-family:'Playfair Display', serif;
    font-size:48px;
    background: linear-gradient(90deg,#ff2e63,#ff8fab,#ff2e63);
    background-size:200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
}

@keyframes shine{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

p{
    font-size:20px;
    max-width:650px;
    margin:auto;
    line-height:1.8;
}

/* COUNTDOWN */
.countdown{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.time-box{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding:15px 20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(255,46,99,0.4);
    min-width:70px;
}

.time-box span{
    display:block;
    font-size:28px;
    font-weight:600;
    color:#ff8fab;
}

.time-box small{
    font-size:12px;
    letter-spacing:1px;
}

/* BOTONES */
.buttons{
    margin-top:40px;
    position:relative;
    height:200px;
}

button{
    padding:15px 40px;
    font-size:18px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    position:absolute;
    transition:0.3s;
    font-weight:600;
}

#yes{
    background:#ff2e63;
    color:white;
    left:30%;
    box-shadow:0 0 25px #ff2e63;
}

#no{
    background:white;
    color:#00172D;
    left:55%;
}

button:hover{
    transform:scale(1.1);
}

/* OLAS */
.wave{
    position:absolute;
    bottom:0;
    width:100%;
    z-index:1;
}

/* CORAZONES */
.heart{
    position:absolute;
    color:#ff4d6d;
    animation:float 6s linear infinite;
    font-size:20px;
}

@keyframes float{
    0%{transform:translateY(0); opacity:1;}
    100%{transform:translateY(-600px); opacity:0;}
}

.final{
    margin-top:150px;
    animation:fadeIn 2s ease-in;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
    <h1>🌊 Linda 💙</h1>

    <p>
        Desde que llegaste a mi vida, cada día se siente como 
        encontrar la ola perfecta al atardecer 🌅  
        Y este 14 de febrero no quiero surfear solo…
        quiero que nuestras almas fluyan como el océano.
    </p>

    <div class="countdown">
        <div class="time-box">
            <span id="days">00</span>
            <small>Días</small>
        </div>
        <div class="time-box">
            <span id="hours">00</span>
            <small>Horas</small>
        </div>
        <div class="time-box">
            <span id="minutes">00</span>
            <small>Min</small>
        </div>
        <div class="time-box">
            <span id="seconds">00</span>
            <small>Seg</small>
        </div>
    </div>

    <div class="buttons">
        <button id="yes" onclick="accept()">Sí acepto 🌊💙</button>
        <button id="no">No acepto 🙈</button>
    </div>
</div>

<svg class="wave" viewBox="0 0 1440 320">
<path fill="#003566" fill-opacity="1"
d="M0,224L60,197.3C120,171,240,117,360,122.7C480,128,600,192,720,213.3C840,235,960,213,1080,186.7C1200,160,1320,128,1380,112L1440,96V320H0Z">
</path>
</svg>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_5e4bfe63b3.mp3?filename=romantic-love-ambient-124003.mp3" type="audio/mp3">
</audio>

<script>
const noBtn = document.getElementById("no");
const music = document.getElementById("music");

document.body.addEventListener("click", () => {
    music.play().catch(()=>{});
});

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 150);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

noBtn.addEventListener("click", accept);

/* COUNTDOWN COMPLETO */
function updateCountdown(){
    const target = new Date("February 14, 2026 00:00:00").getTime();
    const now = new Date().getTime();
    const diff = target - now;

    if(diff <= 0){
        document.querySelector(".countdown").innerHTML = 
        "<h2>🌊 Es hoy, Linda 💙</h2>";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* CORAZONES */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.style.left = Math.random()*100 + "vw";
    heart.innerHTML = "💖";
    document.body.appendChild(heart);
    setTimeout(()=>{heart.remove();},6000);
}
setInterval(createHeart,1000);

function accept(){
    document.body.innerHTML = `
        <div class="stars"></div>
        <div class="final">
            <h1>🏄‍♀️💙 Entonces es oficial, Linda...</h1>
            <p style="font-size:22px; max-width:650px; margin:auto;">
                Este 14 de febrero será nuestro atardecer,  
                nuestra risa frente al mar,  
                y la primera de muchas olas juntos 🌊✨
            </p>
        </div>
    `;
    music.play();
}
</script>

</body>
</html>
