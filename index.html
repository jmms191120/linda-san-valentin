<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linda 💙 Mi Ola Favorita</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
    background:#000814;
    color:white;
    text-align:center;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:0;
}

#overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.3);
    z-index:10;
    padding:20px;
}

h1{
    font-size:42px;
    text-shadow:0 0 20px #00b4d8;
    margin-bottom:10px;
}

p{
    font-size:18px;
    max-width:500px;
}

.countdown{
    display:flex;
    gap:20px;
    margin:25px;
    flex-wrap:wrap;
    justify-content:center;
}

.time-box{
    background:rgba(255,255,255,0.1);
    padding:15px;
    border-radius:15px;
    min-width:70px;
    backdrop-filter:blur(10px);
}

.time-box span{
    display:block;
    font-size:24px;
    color:#90e0ef;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#yes{
    background:#00b4d8;
    color:white;
    box-shadow:0 0 20px #00b4d8;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#03045e;
    color:white;
}

#message{
    margin-top:20px;
    font-size:20px;
    color:#caf0f8;
}
</style>
</head>

<body>

<div id="overlay">
    <h1>Linda 🌊</h1>
    <p>
        Como las olas buscan la orilla…  
        mi corazón siempre te busca a ti 💙  
        ¿Aceptas ser mi San Valentín?
    </p>

    <div class="countdown">
        <div class="time-box"><span id="days">00</span>Días</div>
        <div class="time-box"><span id="hours">00</span>Horas</div>
        <div class="time-box"><span id="minutes">00</span>Min</div>
        <div class="time-box"><span id="seconds">00</span>Seg</div>
    </div>

    <div>
        <button id="yes">Sí acepto 💙</button>
        <button id="no">No acepto</button>
    </div>

    <div id="message"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ================= 3D OLA =================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.PlaneGeometry(50,50,200,200);
const material = new THREE.MeshPhongMaterial({
    color:0x0077b6,
    side:THREE.DoubleSide,
    flatShading:true
});
const plane = new THREE.Mesh(geometry, material);
plane.rotation.x = -Math.PI/2;
scene.add(plane);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(0,10,10);
scene.add(light);

const ambient = new THREE.AmbientLight(0x404040);
scene.add(ambient);

camera.position.z = 20;
camera.position.y = 10;

let clock = new THREE.Clock();

function animate(){
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    const pos = plane.geometry.attributes.position;

    for(let i=0;i<pos.count;i++){
        const x = pos.getX(i);
        const y = pos.getY(i);
        const wave = Math.sin(x*0.3 + time*2) + Math.cos(y*0.5 + time*1.5);
        pos.setZ(i, wave);
    }

    pos.needsUpdate = true;
    plane.geometry.computeVertexNormals();
    renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

// ================= CUENTA REGRESIVA =================
function updateCountdown(){
    const target = new Date("February 14, 2026 00:00:00").getTime();
    const now = new Date().getTime();
    const diff = target - now;

    if(diff <= 0){
        document.querySelector(".countdown").innerHTML =
        "<h2>Es hoy Linda 💙🌊</h2>";
        return;
    }

    const days = Math.floor(diff/(1000*60*60*24));
    const hours = Math.floor((diff/(1000*60*60))%24);
    const minutes = Math.floor((diff/(1000*60))%60);
    const seconds = Math.floor((diff/1000)%60);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
}

updateCountdown();
setInterval(updateCountdown,1000);

// ================= BOTONES =================
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const message = document.getElementById("message");

yesBtn.addEventListener("click",()=>{
    message.innerHTML = "💙 Sabía que dirías que sí... eres mi ola perfecta 🌊✨";
});

// Botón que se escapa
noBtn.style.position = "absolute";

function moveButton(){
    const padding = 100;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

noBtn.addEventListener("mouseover", moveButton);

noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton();
});

noBtn.addEventListener("click",()=>{
    yesBtn.click();
});
</script>

</body>
</html>
